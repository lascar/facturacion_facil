[pytest]
# Configuration pytest pour Facturación Fácil

# Répertoires de test
testpaths = test

# Patterns de fichiers de test
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Marqueurs personnalisés
markers =
    behaviour: Tests de comportement avec interface utilisateur
    slow: Tests lents qui prennent plus de temps
    gui: Tests nécessitant une interface graphique
    integration: Tests d'intégration end-to-end
    smoke: Tests de fumée rapides
    regression: Tests de régression
    unit: Tests unitaires
    performance: Tests de performance

# Options par défaut
addopts =
    --strict-markers
    --tb=short
    -ra

# Timeout pour les tests (en secondes)
timeout = 300

# Filtres de warnings
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore::UserWarning:PyQt5.*
    ignore::pytest.PytestCollectionWarning:database.test_database
    ignore::pytest.PytestReturnNotNoneWarning

# Logging
log_cli = false
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(name)s: %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Répertoire pour les rapports
junit_family = xunit2

